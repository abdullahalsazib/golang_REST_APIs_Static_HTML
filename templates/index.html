<!DOCTYPE html>
<html>

<head>
     <title>User List</title>
</head>

<body>
     <h1>User List</h1>
     <a href="/create">Add New User</a>
     <table border="1">
          <tr>
               <th>ID</th>
               <th>Name</th>
               <th>Email</th>
               <th>Actions</th>
          </tr>
          {{range .}}
          <tr>
               <td>{{.ID}}</td>
               <td>{{.Name}}</td>
               <td>{{.Email}}</td>
               <td>
                    <a href="/edit?id={{.ID}}">Edit</a> |
                    <a href="/delete?id={{.ID}}">Delete</a>
               </td>
          </tr>
          {{end}}
     </table>
</body>

</html>
