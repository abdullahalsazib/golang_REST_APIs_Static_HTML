<!DOCTYPE html>
<html>

<head>
     <title>Update User</title>
     <!-- Bootstrap CSS and icons -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

     <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
     <div class="container my-5">
          <h1 class="text-center mb-4">Update User</h1>
          <form action="/update" method="post" class="p-4 border rounded shadow-sm bg-white">
               <input type="hidden" name="id" value="{{.ID}}">
               <div class="mb-3">
                    <label for="name" class="form-label">
                         <i class="bi bi-person-fill"></i> Name:
                    </label>
                    <input type="text" id="name" name="name" value="{{.Name}}" class="form-control" required>
               </div>
               <div class="mb-3">
                    <label for="email" class="form-label">
                         <i class="bi bi-envelope-fill"></i> Email:
                    </label>
                    <input type="email" id="email" name="email" value="{{.Email}}" class="form-control" required>
               </div>
               <button type="submit" class="btn btn-success">
                    <i class="bi bi-arrow-repeat"></i> Update
               </button>
          </form>
     </div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
